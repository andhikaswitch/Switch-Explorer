"border.input" = "#5A7394"
"border.input_focus" = "{pal.lagoon}"
"divider" = "alpha(#EAF4FF, 0.08)"
"accent.text" = "{pal.accent.400}"
"accent.glow" = "alpha({pal.accent.500}, 0.55)"
"accent.edge" = "{pal.lagoon}"
